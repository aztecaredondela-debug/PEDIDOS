<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camisetas Curritos</title>
<meta name="theme-color" content="#1f7a8c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Curritos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef3f2;--panel:#fff;--ink:#12303b;--mute:#5d7480;--line:#d3dfdf;--sea:#1f7a8c;--sun:#ffc93c;--ok:#1e8a52;--bad:#c2410c;--fs:17px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b21;--panel:#14272f;--ink:#e8f1f1;--mute:#8fa8b0;--line:#27414b;--sea:#4fb3c6;--ok:#4fd08a;--bad:#ff8a5c}}
:root[data-theme="dark"]{--bg:#0d1b21;--panel:#14272f;--ink:#e8f1f1;--mute:#8fa8b0;--line:#27414b;--sea:#4fb3c6;--ok:#4fd08a;--bad:#ff8a5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page,color-mix(in srgb,var(--bg) 90%,var(--sea)));color:var(--ink);font:400 var(--fs)/1.35 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:2.1em;font-weight:800;letter-spacing:-.03em;margin:.2em 0 0;line-height:1}
h1 span{background:var(--sun);color:#12303b;padding:0 .18em;border-radius:.15em;display:inline-block;transform:rotate(-2deg)}
.sub{color:var(--mute);margin:.4em 0 1em;font-size:.9em}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
button,select,input{font:inherit;color:inherit}
.btn{border:1.5px solid var(--ink);background:var(--panel);border-radius:10px;padding:.45em .8em;cursor:pointer;font-weight:600}
.btn:hover{background:var(--sun);color:#12303b}
.btn.main{background:var(--sea);color:#fff;border-color:var(--sea)}
.btn.main:hover{filter:brightness(1.1);background:var(--sea);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.5em .8em}
.stat b{display:block;font-size:1.5em;font-weight:800;line-height:1.1}
.stat small{color:var(--mute)}
.price{display:flex;align-items:center;gap:6px}
.price input{width:4.5em;border:1.5px solid var(--line);border-radius:8px;padding:.25em .4em;background:var(--panel)}
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:.15em .7em;font-size:.85em}
.chip b{color:var(--sea)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:.25em .8em;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:130px;border:1.5px solid var(--line);border-radius:10px;padding:.4em .7em;background:var(--panel)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:1.6em 1fr 5em 2.6em 2.2em;gap:8px;align-items:center;padding:.4em .7em;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.paid{background:color-mix(in srgb,var(--ok) 9%,transparent)}
.num{color:var(--mute);font-size:.8em;text-align:right}
.row input.name{width:100%;border:0;border-bottom:1.5px dashed transparent;background:transparent;padding:.25em 0;font-weight:600}
.row input.name:focus{border-bottom-color:var(--sea);outline:none}
.row select{border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:.2em;width:100%}
.row select.empty{border-color:var(--bad);color:var(--bad)}
.row input[type=checkbox]{width:1.4em;height:1.4em;accent-color:var(--ok);justify-self:center;cursor:pointer}
.del{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:1.1em;border-radius:8px;padding:.2em}
.del:hover{background:var(--bad);color:#fff}
.head{font-size:.75em;color:var(--mute);font-weight:600;background:var(--bg)}
.empty-msg{padding:1.4em;text-align:center;color:var(--mute)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.fab .btn{box-shadow:0 4px 14px rgba(0,0,0,.25);padding:.6em 1.1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.5em .9em;border-radius:10px;display:none;gap:12px;align-items:center;max-width:92%}
.toast.show{display:flex}
.toast button{background:var(--sun);color:#12303b;border:0;border-radius:6px;padding:.15em .6em;font-weight:700;cursor:pointer}
@media (max-width:520px){.row{grid-template-columns:1fr 4.6em 2.4em 2em}.num{display:none}.head .num{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.top{display:flex;gap:14px;align-items:center;margin:0 0 4px}
.crest{width:5em;height:5em;flex:none;border-radius:50%;border:2px dashed var(--mute);background:var(--panel) center/contain no-repeat;cursor:pointer;font-size:.7em;line-height:1.1;color:var(--mute);padding:0}
.crest.has{border:0;background-color:transparent;border-radius:8px}
.ttl{width:100%;min-width:0;border:0;border-bottom:2px dashed transparent;background:transparent;color:var(--ink);font-family:inherit;font-weight:800;font-size:2em;line-height:1.05;letter-spacing:-.03em;padding:.05em 0}
.ttl:focus{border-bottom-color:var(--sun);outline:none}
.orders{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;align-items:stretch}
.oc{flex:none;min-width:9em;text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:.45em .8em;cursor:pointer}
.oc[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--sun)}
.oc b{display:block;font-weight:700}
.oc small{display:block;color:var(--mute)}
.oc.act{border-style:dashed;font-weight:600}
.oc.act:disabled{opacity:.4;cursor:default}
.oc.warn{background:var(--bad);color:#fff;border-color:var(--bad)}
.panel{background:var(--panel);border:1.5px solid var(--ink);border-radius:14px;padding:.8em;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.panel[hidden]{display:none}
.panel label{display:flex;flex-direction:column;gap:3px;font-size:.8em;color:var(--mute);font-weight:600}
.panel input{border:1.5px solid var(--line);border-radius:8px;padding:.35em .5em;background:var(--bg);font-size:1.15em;color:var(--ink)}
.panel .pn{flex:1;min-width:11em}
.btn.warn{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:2.3em;height:2.3em;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sw button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.panel input[type=color]{padding:0;width:3em;height:2.3em;cursor:pointer}
#cpanel{flex-basis:100%}
.ph{flex-basis:100%;font-size:.8em;color:var(--mute);font-weight:600}
</style>
</head>
<body>
<main>
  <div class="top"><button class="crest" id="crest" aria-label="Cambiar escudo"></button><input type="file" id="crestf" accept="image/*" hidden><input class="ttl" id="ttl" aria-label="Nombre del pedido" maxlength="60" placeholder="Nombre del pedido"><button class="btn" id="edit" aria-expanded="false">Editar pedido</button></div>
  <div class="panel" id="panel" hidden>
    <label class="pn">Nombre del pedido<input id="pn" maxlength="60"></label>
    <label>Fecha de creación<input id="pd" type="date"></label>
    <button class="btn" id="pclose">Listo</button>
    <button class="btn danger" id="pdel">Eliminar pedido</button>
  </div>
  <p class="sub" id="sub"></p>
  <div class="orders" id="orders"></div>

  <div class="bar">
    <button class="btn main" id="dl">Descargar Excel</button>
    <button class="btn" id="savebtn">Guardar</button>
    <button class="btn" id="exp">Exportar copia</button>
    <button class="btn" id="imp">Importar copia</button>
    <input type="file" id="impf" accept=".json,application/json" hidden>
    <button class="btn" id="fsm" aria-label="Reducir texto">A−</button>
    <button class="btn" id="fsp" aria-label="Aumentar texto">A+</button>
    <button class="btn" id="theme" aria-label="Cambiar tema">Claro/oscuro</button>
    <button class="btn" id="colors" aria-expanded="false">Colores</button>
    <div class="panel" id="cpanel" hidden>
      <span class="ph">Color principal</span>
      <div class="sw" id="sw" role="group" aria-label="Paletas"></div>
      <label>Color propio<input type="color" id="cc"></label>
      <button class="btn" id="creset">Restablecer</button>
      <span class="ph">Color de fondo</span>
      <div class="sw" id="bgsw" role="group" aria-label="Fondos"></div>
      <label>Fondo propio<input type="color" id="bc"></label>
      <button class="btn" id="bgreset">Restablecer fondo</button>
    </div>
    <span class="grow"></span>
    <label class="price">Precio <input id="price" type="number" min="0" step="0.5" value="0" inputmode="decimal"> €</label>
  </div>

  <div class="stats" id="stats"></div>
  <div class="sizes" id="sizes" aria-label="Resumen por talla"></div>

  <div class="bar">
    <div class="tabs" id="tabs">
      <button class="tab" data-f="all" aria-pressed="true">Todos</button>
      <button class="tab" data-f="pend" aria-pressed="false">Sin pagar</button>
      <button class="tab" data-f="nosize" aria-pressed="false">Sin talla</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Buscar nombre…">
  </div>

  <div class="list" id="list"></div>
</main>

<div class="fab">
  <button class="btn" id="add5">+5 huecos</button>
  <button class="btn main" id="add">+ Añadir persona</button>
</div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="undo">Deshacer</button></div>

let G={orders:[],cur:0,fs:17,theme:"",logo:""};
let S;
let filter="all",query="",lastDel=null,tt,undoFn=null;
const $=id=>document.getElementById(id);
const KEY="curritos-v1";

try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);
 if(d&&Array.isArray(d.orders)&&d.orders.length)G=d;
 else if(d&&Array.isArray(d.rows)){G.fs=d.fs||17;G.theme=d.theme||"";const o=newOrder("Camisetas Curritos",d.rows);o.price=d.price||0;G.orders=[o]}}}catch(e){}
if(!G.orders.length)G.orders=[newOrder("Camisetas Curritos",NAMES.map(mk))];
if(G.cur>=G.orders.length||G.cur<0)G.cur=0;
G.orders.forEach(o=>o.rows.forEach(r=>{uid=Math.max(uid,r.id)}));
S=G.orders[G.cur];
let savedOk=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(G));savedOk=true}catch(e){savedOk=false}}

function applyLook(){
  document.documentElement.style.setProperty("--fs",G.fs+"px");
  if(G.theme)document.documentElement.setAttribute("data-theme",G.theme);
  const rs=document.documentElement.style;
  if(G.accent){rs.setProperty("--sea",G.accent.sea);rs.setProperty("--sun",G.accent.sun)}else{rs.removeProperty("--sea");rs.removeProperty("--sun")}
  const BGP=["--bg","--page","--ink","--mute","--line","--panel"];
  if(G.bg){
    const h=G.bg.replace("#",""),lum=(parseInt(h.slice(0,2),16)*299+parseInt(h.slice(2,4),16)*587+parseInt(h.slice(4,6),16)*114)/1000,dk=lum<140;
    rs.setProperty("--bg",G.bg);rs.setProperty("--page",G.bg);
    rs.setProperty("--ink",dk?"#e8f1f1":"#12303b");rs.setProperty("--mute",dk?"#8fa8b0":"#5d7480");
    rs.setProperty("--line","color-mix(in srgb,"+G.bg+" 80%,"+(dk?"#fff":"#12303b")+")");
    rs.setProperty("--panel",dk?"color-mix(in srgb,"+G.bg+" 86%,#fff)":"color-mix(in srgb,"+G.bg+" 35%,#fff)");
  }else BGP.forEach(k=>rs.removeProperty(k));
  renderSw();
  $("price").value=S.price||0;
}

function stats(){
  renderOrders();
  const R=S.rows.filter(r=>r.n.trim()||r.t);
  const paid=R.filter(r=>r.p).length, pend=R.length-paid, pr=+S.price||0;
  const noSize=R.filter(r=>!r.t).length;
  const st=[[R.length,"personas"],[paid,"pagadas"],[pend,"por pagar"]];
  if(pr>0){st.push([(paid*pr).toFixed(2).replace(/\.00$/,"")+" €","cobrado"],[(pend*pr).toFixed(2).replace(/\.00$/,"")+" €","pendiente"])}
  $("stats").innerHTML=st.map(s=>`<div class="stat"><b>${s[0]}</b><small>${s[1]}</small></div>`).join("");
  const cnt={};R.forEach(r=>{if(r.t)cnt[r.t]=(cnt[r.t]||0)+1});
  $("sizes").innerHTML=SIZES.filter(z=>cnt[z]).map(z=>`<span class="chip">${z} <b>${cnt[z]}</b></span>`).join("")+(noSize?`<span class="chip">Sin talla <b>${noSize}</b></span>`:"");
}

function render(focusId){
  stats();
  const list=$("list");list.textContent="";
  const head=document.createElement("div");head.className="row head";
  head.innerHTML='<span class="num">Nº</span><span>Nombre</span><span>Talla</span><span>Pagó</span><span></span>';
  list.appendChild(head);
  const q=query.toLowerCase();
  let shown=0;
  S.rows.forEach((r,i)=>{
    if(filter==="pend"&&r.p)return;
    if(filter==="nosize"&&r.t)return;
    if(q&&!r.n.toLowerCase().includes(q))return;
    shown++;
    const row=document.createElement("div");row.className="row"+(r.p?" paid":"");
    const num=document.createElement("span");num.className="num";num.textContent=i+1;
    const nm=document.createElement("input");nm.className="name";nm.value=r.n;nm.placeholder="Nombre";nm.setAttribute("aria-label","Nombre");nm.dataset.id=r.id;
    nm.oninput=()=>{r.n=nm.value;save();stats()};
    nm.onkeydown=e=>{if(e.key==="Enter"&&i===S.rows.length-1){addRows(1)}};
    const sel=document.createElement("select");sel.setAttribute("aria-label","Talla");
    sel.className=r.t?"":"empty";
    sel.innerHTML='<option value="">Talla</option>'+SIZES.map(z=>`<option${z===r.t?" selected":""}>${z}</option>`).join("");
    sel.onchange=()=>{r.t=sel.value;sel.className=r.t?"":"empty";save();stats()};
    const ck=document.createElement("input");ck.type="checkbox";ck.checked=r.p;ck.setAttribute("aria-label","Pagado");
    ck.onchange=()=>{r.p=ck.checked;row.classList.toggle("paid",r.p);save();stats();if(filter==="pend"&&r.p)render()};
    const del=document.createElement("button");del.className="del";del.textContent="✕";del.setAttribute("aria-label","Borrar a "+(r.n||"esta fila"));
    del.onclick=()=>{undoFn=null;lastDel={r,i};S.rows.splice(i,1);save();render();toast("Borrado: "+(r.n||"fila vacía"))};
    row.append(num,nm,sel,ck,del);list.appendChild(row);
  });
  if(!shown){const m=document.createElement("div");m.className="empty-msg";m.textContent=S.rows.length?"Nada que mostrar con este filtro.":"Lista vacía. Pulsa «Añadir persona».";list.appendChild(m)}
  if(focusId){const el=list.querySelector(`input.name[data-id="${focusId}"]`);if(el){el.focus();el.scrollIntoView({block:"center"})}}
}

function addRows(n){
  if(filter!=="all"||query){filter="all";query="";$("q").value="";syncTabs()}
  let last;for(let k=0;k<n;k++){last=mk();S.rows.push(last)}
  save();render(n===1?last.id:null);
  if(n>1){window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
}
function toast(msg){$("tmsg").textContent=msg;$("toast").classList.add("show");clearTimeout(tt);tt=setTimeout(()=>$("toast").classList.remove("show"),6000)}
function syncTabs(){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===filter))}

$("add").onclick=()=>addRows(1);
$("add5").onclick=()=>addRows(5);
$("undo").onclick=()=>{if(undoFn){const f=undoFn;undoFn=null;f();$("toast").classList.remove("show");return}if(!lastDel)return;S.rows.splice(Math.min(lastDel.i,S.rows.length),0,lastDel.r);lastDel=null;save();render();$("toast").classList.remove("show")};
$("fsm").onclick=()=>{G.fs=Math.max(12,G.fs-2);applyLook();save()};
$("fsp").onclick=()=>{G.fs=Math.min(30,G.fs+2);applyLook();save()};
$("theme").onclick=()=>{const dark=(G.theme?G.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches);G.theme=dark?"light":"dark";applyLook();save()};
$("price").oninput=e=>{S.price=parseFloat(e.target.value)||0;save();stats()};
$("q").oninput=e=>{query=e.target.value;render()};
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;filter=b.dataset.f;syncTabs();render()};

$("dl").onclick=async()=>{
  const R=S.rows.filter(r=>r.n.trim()||r.t);
  const aoa=[[(S.name||"Pedido").toUpperCase()+" - creado el "+fmt(S.created)],["NOMBRE","TALLA","PAGADO"],...R.map(r=>[r.n.trim(),r.t,r.p?"SÍ":"NO"])];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=[{wch:30},{wch:8},{wch:10}];
  ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:2}}];
  const cnt={};R.forEach(r=>{const k=r.t||"Sin talla";cnt[k]=(cnt[k]||0)+1});
  const res=[["TALLA","CANTIDAD"],...[...SIZES,"Sin talla"].filter(z=>cnt[z]).map(z=>[z,cnt[z]]),["TOTAL",R.length]];
  const w2=XLSX.utils.aoa_to_sheet(res);w2["!cols"]=[{wch:12},{wch:10}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Camisetas");
  XLSX.utils.book_append_sheet(wb,w2,"Resumen tallas");
  try{XLSX.writeFile(wb,((S.name||"pedido").toLowerCase().replace(/ñ/g,"n").replace(/[áéíóúü]/g,c=>"aeiouu"["áéíóúü".indexOf(c)]).replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"pedido")+".xlsx")}catch(e){toast("No se pudo descargar el Excel")}
};

const fmt=iso=>new Date(iso).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"});
const mkb=(txt,cls,fn)=>{const b=document.createElement("button");b.className=cls;b.textContent=txt;b.onclick=fn;return b};
let armDel=false;
function switchTo(i){G.cur=i;S=G.orders[i];armDel=false;filter="all";query="";$("q").value="";syncTabs();applyLook();save();render()}
function renderOrders(){
  const box=$("orders");box.textContent="";
  G.orders.forEach((o,i)=>{
    const b=document.createElement("button");b.className="oc";b.setAttribute("aria-current",i===G.cur);
    const R=o.rows.filter(r=>r.n.trim()||r.t);
    const t=document.createElement("b");t.textContent=o.name||"Sin nombre";
    const d=document.createElement("small");d.textContent=fmt(o.created);
    const c=document.createElement("small");c.textContent=R.filter(r=>r.p).length+"/"+R.length+" pagadas";
    b.append(t,d,c);b.onclick=()=>switchTo(i);box.appendChild(b);
  });
  box.appendChild(mkb("+ Nuevo pedido","oc act",()=>{G.orders.push(newOrder("Pedido nuevo",[mk(),mk(),mk(),mk(),mk()]));switchTo(G.orders.length-1);$("ttl").focus();$("ttl").select()}));
  box.appendChild(mkb("Duplicar este pedido","oc act",()=>{G.orders.push(newOrder(S.name+" (copia)",S.rows.map(r=>mk(r.n))));switchTo(G.orders.length-1);toast("Copiados los nombres, sin tallas ni pagos")}));
  const pd=$("pdel");pd.textContent=armDel?"¿Seguro? Pulsa otra vez":"Eliminar pedido";pd.className="btn "+(armDel?"warn":"danger");
  if(G.logo)box.appendChild(mkb("Escudo SAR original","oc act",()=>{G.logo="";save();renderOrders()}));
  const ti=$("ttl");if(document.activeElement!==ti)ti.value=S.name;
  $("sub").textContent="Creado el "+fmt(S.created)+". Se guarda solo en este navegador.";
  const cr=$("crest");cr.style.backgroundImage='url("'+(G.logo||LOGO)+'")';cr.classList.add("has");cr.textContent="";
}
$("ttl").oninput=e=>{S.name=e.target.value;save();renderOrders()};
$("crest").onclick=()=>$("crestf").click();
$("crestf").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,256/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);G.logo=cv.toDataURL("image/png");save();renderOrders()};img.onerror=()=>toast("No se pudo leer la imagen");img.src=rd.result};
  rd.readAsDataURL(f);e.target.value=""};
const iso10=iso=>{const d=new Date(iso);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
$("edit").onclick=()=>{const p=$("panel");p.hidden=!p.hidden;$("edit").setAttribute("aria-expanded",!p.hidden);if(!p.hidden){$("pn").value=S.name;$("pd").value=iso10(S.created);$("pn").focus()}};
$("pn").oninput=e=>{S.name=e.target.value;$("ttl").value=S.name;save();renderOrders()};
$("pd").onchange=e=>{if(e.target.value){S.created=new Date(e.target.value+"T12:00:00").toISOString();save();renderOrders()}};
$("pclose").onclick=()=>{$("panel").hidden=true;$("edit").setAttribute("aria-expanded","false")};
$("pdel").onclick=()=>{
  if(!armDel){armDel=true;renderOrders();setTimeout(()=>{armDel=false;renderOrders()},4000);return}
  const n=S.name;G.orders.splice(G.cur,1);
  if(!G.orders.length)G.orders.push(newOrder("Pedido nuevo",[mk(),mk(),mk(),mk(),mk()]));
  $("panel").hidden=true;switchTo(Math.max(0,Math.min(G.cur-1,G.orders.length-1)));toast("Pedido eliminado: "+(n||"sin nombre"));
};
const PRESETS=[{n:"Atlántico",sea:"#1f7a8c",sun:"#ffc93c"},{n:"SAR verde",sea:"#1e8a52",sun:"#ffe14a"},{n:"Granate",sea:"#a4243b",sun:"#f2c14e"},{n:"Azul rey",sea:"#2f5fd0",sun:"#ffd166"},{n:"Morado",sea:"#7b3fb5",sun:"#ffd166"},{n:"Naranja",sea:"#d9560f",sun:"#ffe08a"},{n:"Rosa",sea:"#d6336c",sun:"#ffe066"},{n:"Grafito",sea:"#3d4a52",sun:"#ffc93c"}];
const BGS=[{n:"Hielo",c:"#eef3f2"},{n:"Blanco",c:"#ffffff"},{n:"Menta",c:"#e0f2e8"},{n:"Cielo",c:"#e1ecfa"},{n:"Lavanda",c:"#ece4f7"},{n:"Rosa",c:"#fbe4ec"},{n:"Crema",c:"#f6efdf"},{n:"Gris",c:"#dfe3e6"},{n:"Pizarra",c:"#232f3a"},{n:"Noche",c:"#0d1b21"},{n:"Bosque",c:"#0f2a1d"},{n:"Negro",c:"#000000"}];
function renderSw(){
  const sw=$("sw");if(!sw)return;sw.textContent="";
  PRESETS.forEach((c,i)=>{
    const on=G.accent?(G.accent.sea===c.sea&&G.accent.sun===c.sun):i===0;
    const b=document.createElement("button");b.setAttribute("aria-label",c.n);b.title=c.n;b.setAttribute("aria-pressed",on);
    b.style.background="linear-gradient(135deg,"+c.sea+" 58%,"+c.sun+" 58%)";
    b.onclick=()=>{G.accent=i===0?null:{sea:c.sea,sun:c.sun};applyLook();save()};
    sw.appendChild(b);
  });
  $("cc").value=(G.accent||PRESETS[0]).sea;
  const bs=$("bgsw");bs.textContent="";
  BGS.forEach((c,i)=>{
    const b=document.createElement("button");b.setAttribute("aria-label",c.n);b.title=c.n;b.setAttribute("aria-pressed",G.bg?G.bg===c.c:i===0);
    b.style.background=c.c;b.onclick=()=>{G.bg=i===0?null:c.c;applyLook();save()};bs.appendChild(b);
  });
  $("bc").value=G.bg||BGS[0].c;
}
$("colors").onclick=()=>{const p=$("cpanel");p.hidden=!p.hidden;$("colors").setAttribute("aria-expanded",!p.hidden)};
$("cc").oninput=e=>{G.accent={sea:e.target.value,sun:(G.accent&&G.accent.sun)||PRESETS[0].sun};applyLook();save()};
$("bc").oninput=e=>{G.bg=e.target.value;applyLook();save()};
$("bgreset").onclick=()=>{G.bg=null;applyLook();save()};
$("creset").onclick=()=>{G.accent=null;applyLook();save()};
async function saveFile(name,data,mime){
  try{if(window.claude&&claude.use){const d=await claude.use("downloads");if(d){await d.save({filename:name,data});return}}}catch(e){if(e&&e.code==="declined")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
$("savebtn").onclick=()=>{save();const h=new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  toast(savedOk?"Guardado en este navegador a las "+h:"No se pudo guardar: el navegador bloquea el almacenamiento. Usa Exportar copia.")};
$("exp").onclick=()=>{save();const d=new Date().toISOString().slice(0,10);saveFile("copia_camisetas_"+d+".json",JSON.stringify(G),"application/json").catch(()=>toast("No se pudo exportar la copia"))};
$("imp").onclick=()=>$("impf").click();
$("impf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.orders)||!d.orders.length||!d.orders.every(o=>o&&Array.isArray(o.rows)))throw 0;
    const prev=JSON.stringify(G);
    G=Object.assign({fs:17,theme:"",logo:"",cur:0},d);G.cur=0;
    G.orders.forEach(o=>{o.name=o.name||"Pedido";o.created=o.created||new Date().toISOString();o.price=o.price||0;o.rows.forEach(r=>{uid=Math.max(uid,+r.id||0)})});
    undoFn=()=>{G=JSON.parse(prev);S=G.orders[G.cur];applyLook();save();render()};
    switchTo(0);toast("Copia cargada: "+G.orders.length+(G.orders.length===1?" pedido":" pedidos"));
  }catch(err){toast("Ese archivo no es una copia válida")}};
applyLook();render();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
